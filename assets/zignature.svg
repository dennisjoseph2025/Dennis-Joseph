<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Zignature — job agency platform for candidates, employers and recruiters">
  <defs>
    <linearGradient id="z-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1410"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="z-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="z-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15211C"/>
      <stop offset="1" stop-color="#101815"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#z-bg)"/>

  <!-- job listing cards -->
  <g opacity="0.95">
    <rect x="700" y="150" width="420" height="118" rx="14" fill="url(#z-card)" stroke="#1F8A6B" stroke-opacity="0.45"/>
    <rect x="700" y="296" width="420" height="118" rx="14" fill="url(#z-card)" stroke="#1F8A6B" stroke-opacity="0.35"/>
    <rect x="700" y="442" width="420" height="118" rx="14" fill="url(#z-card)" stroke="#1F8A6B" stroke-opacity="0.25"/>
  </g>
  <g>
    <rect x="730" y="180" width="34" height="34" rx="9" fill="#2DD4A7" fill-opacity="0.22"/>
    <rect x="780" y="184" width="196" height="12" rx="6" fill="url(#z-accent)"/>
    <rect x="780" y="208" width="128" height="10" rx="5" fill="#4B5F57"/>
    <rect x="730" y="240" width="90" height="18" rx="9" fill="#2DD4A7" fill-opacity="0.16"/>
    <rect x="832" y="240" width="74" height="18" rx="9" fill="#2DD4A7" fill-opacity="0.16"/>
  </g>
  <g opacity="0.8">
    <rect x="730" y="326" width="34" height="34" rx="9" fill="#2DD4A7" fill-opacity="0.16"/>
    <rect x="780" y="330" width="164" height="12" rx="6" fill="#D4E4DD"/>
    <rect x="780" y="354" width="146" height="10" rx="5" fill="#4B5F57"/>
    <rect x="730" y="386" width="104" height="18" rx="9" fill="#2DD4A7" fill-opacity="0.12"/>
  </g>
  <g opacity="0.6">
    <rect x="730" y="472" width="34" height="34" rx="9" fill="#2DD4A7" fill-opacity="0.12"/>
    <rect x="780" y="476" width="180" height="12" rx="6" fill="#D4E4DD"/>
    <rect x="780" y="500" width="120" height="10" rx="5" fill="#4B5F57"/>
    <rect x="730" y="532" width="80" height="18" rx="9" fill="#2DD4A7" fill-opacity="0.10"/>
  </g>

  <!-- search bar -->
  <g opacity="0.9">
    <rect x="700" y="596" width="420" height="52" rx="26" fill="#0F1714" stroke="#1F8A6B" stroke-opacity="0.4"/>
    <circle cx="734" cy="622" r="8" fill="none" stroke="#3DDC97" stroke-width="2.5"/>
    <line x1="740" y1="628" x2="746" y2="634" stroke="#3DDC97" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="764" y="617" width="180" height="10" rx="5" fill="#4B5F57"/>
    <rect x="1028" y="608" width="76" height="28" rx="14" fill="url(#z-accent)"/>
  </g>

  <!-- left wordmark -->
  <rect x="90" y="300" width="8" height="150" rx="4" fill="url(#z-accent)"/>
  <text x="130" y="352" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#3DDC97" letter-spacing="5">JOB AGENCY</text>
  <text x="128" y="438" font-family="Segoe UI,system-ui,sans-serif" font-size="70" font-weight="700" fill="#F1F7F4" letter-spacing="-1">Zignature</text>
  <text x="130" y="486" font-family="Segoe UI,system-ui,sans-serif" font-size="23" fill="#7C8B85">Candidates, employers and recruiters</text>
</svg>
